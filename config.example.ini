# 配置模板（脱敏版，可入库）
# 说明：真实运行时由 config_loader.py 首次启动自动生成本文件并填充出厂默认值；
#      账户/密钥类字段请自行填写，真实 config.ini 已在 .gitignore 中排除。

[账户]
# 快期账号（模拟盘）
TQ_ACCOUNT =
TQ_PASSWORD =
# 交易模式：sim=模拟盘，real=实盘
TRADE_MODE = sim
# 实盘期货公司代码与账号（模拟盘留空）
REAL_BROKER_ID =
REAL_ACCOUNT =
REAL_PASSWORD =

[微信推送]
# Server酱 SendKey，留空则不推送
SERVERCHAN_KEY =
WECHAT_PUSH_ENABLED = false
WECHAT_MIN_INTERVAL_SECONDS = 300

[日志]
LOG_TO_FILE = true
LOG_FILE_MAX_BYTES = 5242880
LOG_FILE_BACKUP_COUNT = 3
DEBUG_LOG = true

[品种与K线]
# 跟踪品种（英文逗号分隔，启动时自动解析主力合约）
SYMBOLS = m,c,cs,SR,v,TA,MA,FG,UR,SA,sp
KLINE_INTERVAL = 60
KLINE_LENGTH = 500
INIT_BARS = 120

[指标]
MACD_FAST = 12
MACD_SLOW = 26
MACD_SIGNAL = 9
MA_PERIOD = 120

[笔]
BI_MA_PERIOD = 20
BI_CONFIRM_BARS = 4
BI_MIN_BARS = 6

[中枢过滤]
ZHONGSHU_ENABLED = true
ZHONGSHU_MAX_SEG = 9
ZHONGSHU_EXTEND_COOLDOWN = 6
ZHONGSHU_DIR_BY_TREND = false
# 中枢最小有效宽度（价格点）与相对门槛（倍数×5分钟平均振幅，取大者）
ZHONGSHU_MIN_WIDTH_POINTS = 20
ZHONGSHU_MIN_WIDTH_ATR_MULT = 1.5
# 过滤器执行模式：off=不检查 / log=只记录不拦 / block=真拦截
ZHONGSHU_FILTER_MODE = log

[买卖点]
BS_ENABLED = true
BS_BUY1 = true
BS_BUY2 = true
BS_BUY3 = true
BS_SELL1 = true
BS_SELL2 = true
BS_SELL3 = true
BS_ZONE = true
BS_ZD_BUFFER = 3
BS_ZONE_MIN_RANGE = 20
BS_CONFIRM_ENABLED = true
PENDING_BS_MAX_BARS = 30

[风控]
POSITION_SIZE = 1
MAX_POSITION = 2
MAX_TOTAL_POSITIONS = 4
MAX_RISK_PER_TRADE_RATIO = 0.02
MIN_AVAILABLE_MARGIN_RATIO = 0.3

[趋势闸门]
TREND_FILTER_ENABLED = true
TREND_KLINE_INTERVAL = 300
TREND_KLINE_LENGTH = 500
TREND60_KLINE_INTERVAL = 3600
TREND60_MA_PERIOD = 20
TREND60_KLINE_LENGTH = 300
TREND60_CONFIRM_BARS = 5
TREND60_CONFIRM_MIN = 3

[双态判定]
DUAL_STATE_ENABLED = false
OSC_MIN_RANGE_POINTS = 20
OSC_STOP_LOSS_POINTS = 15
OSC_ZD_TOLERANCE = 3
OSC_BREAK_DISTANCE_MULT = 1.5

[止损止盈]
STOP_LOSS_POINTS = 15
TRAILING_START_POINTS = 15
TRAILING_STEP_POINTS = 5
TRAILING_LOCK_DIFF = 12

[收盘与夜盘]
FORCE_CLOSE_BEFORE_MINUTES = 5
NO_NEW_POSITION_BEFORE_MINUTES = 10
